name: IPD - GitHub a Databricks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: databricks-git-folder-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validar proyecto
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias de prueba
        run: python -m pip install pytest==8.4.2
      - name: Ejecutar pruebas
        run: python -m pytest -q

  sync:
    name: Sincronizar y verificar Git Folder
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_REPO_ID: ${{ vars.DATABRICKS_REPO_ID }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_BRANCH: main
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Actualizar Git Folder y comprobar el commit
        run: python scripts/sync_databricks_git_folder.py
      - name: Publicar evidencia de sincronización
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: databricks-sync-${{ github.sha }}
          path: artifacts/databricks-sync.json
          if-no-files-found: error
          retention-days: 30
      - name: Resumen de la sincronización
        run: |
          echo '### Git Folder sincronizado y verificado' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $EXPECTED_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo 'La lectura S3 y la carga Silver se ejecutan con el workflow diario de Databricks.' >> "$GITHUB_STEP_SUMMARY"
