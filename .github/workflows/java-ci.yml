name: Java Maven CI

on:
  push:
    branches:
      - feature/s07-java-architecture
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    name: Verify Java 17 modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp clean verify
