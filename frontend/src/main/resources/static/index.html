<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPD | Inteligencia Deportiva</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:40px auto;max-width:760px;padding:0 20px;color:#17304a;background:#f4f7fb}
main{background:#fff;padding:32px;border-radius:14px;box-shadow:0 8px 24px #0001}
h1{margin-top:0}button{padding:10px 16px;cursor:pointer}li{margin:10px 0}
</style></head>
<body><main><h1>IPD · Inteligencia Deportiva</h1>
<p>Versión 2.0.0 · Arquitectura académica Java + Spark.</p>
<button id="load">Consultar datos de demostración</button><p id="status"></p><ul id="out"></ul>
<script>
document.getElementById('load').onclick=async()=>{
 const status=document.getElementById('status'), out=document.getElementById('out');out.innerHTML='';
 try {let r=await fetch('http://localhost:8080/api/deportistas/demo');if(!r.ok)throw Error(r.status);
 let data=await r.json();status.textContent='API conectada (datos de demostración)';
 data.forEach(d=>{let li=document.createElement('li');li.textContent=d.nombre+' · '+d.disciplina+' · '+d.edad+' años';out.appendChild(li);});
 }catch(e){status.textContent='Inicia primero backend-api en el puerto 8080.';}
};
</script></main></body></html>
